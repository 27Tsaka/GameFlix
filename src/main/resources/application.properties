
spring.application.name=GameFlix

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gameflix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gameflixpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
